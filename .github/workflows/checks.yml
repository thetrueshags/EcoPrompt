name: Checks
on:
  push:
  pull_request:
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
